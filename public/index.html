        <div style="font-family: sans-serif; max-width: 600px; margin: 4rem auto; padding: 2rem; border: 2px solid #e11d48; border-radius: 12px; background: #fff1f2; color: #9f1239; text-align: center;">

            Open http://localhost:3000 &rarr;
          </a>
        </div>
      `;
    } else if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            reg.update();
            console.log('SchoolDirect Service Worker Active:', reg.scope);
          })
          .catch(err => console.log('Service Worker reg notice:', err));
      });
    }
  </script>
