# ==============================================================================
# SkoolFinder Ghana - Production Nginx Reverse Proxy Configuration
# Domain: skoolfinder.com.gh / www.skoolfinder.com.gh
# ==============================================================================

# Upstream Node.js application server
upstream skoolfinder_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS (Strict SSL Enforcement)
server {
    listen 80;
    listen [::]:80;
    server_name skoolfinder.com.gh www.skoolfinder.com.gh;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Secure Enterprise Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skoolfinder.com.gh www.skoolfinder.com.gh;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/skoolfinder.com.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoolfinder.com.gh/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/skoolfinder.com.gh/chain.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com data: blob:;" always;

    # Gzip Compression for low-bandwidth 3G/4G Ghanaian mobile users
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Request Size Limits (allow up to 25MB for infirmary documents and transcripts)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://skoolfinder_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Healthcheck Route (No log clutter)
    location = /health {
        proxy_pass http://skoolfinder_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://skoolfinder_backend;
        proxy_http_version 1.1;

        # WebSocket & Long Polling Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for slow connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
