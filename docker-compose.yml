# ==============================================================================
# SkoolFinder Ghana - Docker Compose Production Architecture
# Enterprise School Directory & Educational Procurement Platform
# ==============================================================================

version: '3.8'

services:
  skoolfinder-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: skoolfinder-ghana:latest
    container_name: skoolfinder-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Africa/Accra
      - JWT_SECRET=skoolfinder_ghana_secure_jwt_key_2026_enterprise
      - HUBTEL_CLIENT_ID=gh_hubtel_live_skoolfinder
      - HUBTEL_CLIENT_SECRET=gh_hubtel_secret_key_84920491
      - HUBTEL_SENDER_ID=SkoolFinder
      - PAYSTACK_PUBLIC_KEY=pk_live_gh_paystack_school_direct_0921
      - PAYSTACK_SECRET_KEY=sk_live_gh_paystack_school_direct_0921
      - MAX_BACKUPS=30
    volumes:
      # Persistent storage for JSON database and file attachments
      - ./data:/app/data
      # Mount automated backups outside container
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - skoolfinder-network

networks:
  skoolfinder-network:
    driver: bridge
