services:
  - type: web
    name: skoolfinder-ghana
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TZ
        value: Africa/Accra
      - key: PG_POOL_MAX
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        value: pk_test_skoolfinder_ghana_sandbox
      - key: PAYSTACK_SECRET_KEY
        value: sk_test_skoolfinder_ghana_sandbox
      - key: HUBTEL_CLIENT_ID
        value: simulated_hubtel_client_id
      - key: HUBTEL_CLIENT_SECRET
        value: simulated_hubtel_client_secret
      - key: HUBTEL_SENDER_ID
        value: SkoolFinder
